<main class="dashboard-page">
  <section class="metric-grid" aria-label="Dashboard Kennzahlen">
    <article class="metric-card highlight">
      <span>Aktive Reisen</span>
      <strong>{{ activeTripCount }}</strong>
    </article>
    <article class="metric-card">
      <span>Kommende Reisen</span>
      <strong>{{ upcomingTripCount }}</strong>
    </article>
    <article class="metric-card">
      <span>Kalendereintraege</span>
      <strong>{{ entries.length }}</strong>
    </article>
    <article class="metric-card">
      <span>Gespeicherte Reisen</span>
      <strong>{{ trips.length }}</strong>
    </article>
  </section>
</main>
