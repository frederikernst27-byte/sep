<nav class="navbar">
  <a class="navbar-title" routerLink="/dashboard">Travel App</a>

  <div class="navbar-links" aria-label="Hauptnavigation">
    <a
      class="navbar-link"
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Dashboard
    </a>
    <a
      class="navbar-link"
      routerLink="/calendar"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Kalender
    </a>
  </div>

  <button class="menu-button" (click)="toggleMenu()" aria-label="Menue oeffnen">
    ...
  </button>

  <div class="dropdown" *ngIf="menuOpen">
    <button class="dropdown-item" (click)="goToProfile()">
      Profil
    </button>
    <button class="dropdown-item logout-item" (click)="openLogoutDialog()">
      Logout
    </button>
  </div>
</nav>

<div class="overlay" *ngIf="showLogoutDialog" (click)="cancelLogout()">
  <div class="logout-dialog" (click)="$event.stopPropagation()">
    <h3>Abmelden?</h3>
    <p>Moechtest du dich wirklich ausloggen?</p>
    <div class="dialog-buttons">
      <button class="btn-cancel" (click)="cancelLogout()">Abbrechen</button>
      <button class="btn-logout" (click)="confirmLogout()">Ausloggen</button>
    </div>
  </div>
</div>
